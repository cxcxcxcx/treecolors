[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-color-tree-map"
version = "0.2.0"
description = "Multi-city street-tree inventory pipeline and fall-color map"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.1",
    "openai>=2.8.1",
    "pandas>=2.0",
    "pyproj>=3.6",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "websocket-client>=1.8",
]
legacy = [
    "folium>=0.17",
]

[tool.setuptools]
packages = ["tree_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
