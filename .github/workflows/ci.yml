name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Byte-compile pipeline
        run: python -m py_compile py/tree_pipeline/*.py
      - name: Unit tests
        run: PYTHONPATH=py python -m pytest -q py/tests
      - name: README city table is current
        run: python scripts/readme_cities.py --check
